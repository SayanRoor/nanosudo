<!--
  Case cover generator -- produces public/cases/*.jpg cover images instead
  of live-site screenshots (unified brand style, no dependency on a client
  site being reachable or well-designed).

  Logos come from the logo kit copied into public/brand/ (source: kit/).

  Usage:
    1. python3 -m http.server 8842   (from the repo root, so ../public resolves)
    2. Open /scripts/generate-case-covers.html?id=<project-id> for each id in
       src/lib/portfolio-data.ts (invite, rals, okiyo, egemen, kazgazeta,
       kazpravda, nativetravel, zakyat-kz)
    3. Screenshot the page at its native resolution (no browser chrome)
    4. Crop to 16:9 at native resolution -- no upscaling:
       magick shot.jpg -gravity center -extent WxH -quality 95 out.jpg
       where W = round(H * 16/9), H = the screenshot's own height
    5. Save as public/cases/<id>.jpg

  To add a new case: add an entry to the PROJECTS map below (name, category,
  tags, year, accent, orb position) mirroring its portfolio-data.ts entry.
-->
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Case cover generator</title>
<style>
  :root {
    --bg: #07080A;
    --surface: #18181b;
    --border: rgba(63, 63, 70, 0.7);
    --muted: #a1a1aa;
    --fg: #fafafa;
    --accent: #8cc84b;
    --azure: #99b9ff;
    --spring: #78ffd1;
    --flamingo: #ffb3c2;
    --lime: #f0ffa6;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg);
    overflow: hidden;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: var(--bg);
  }

  /* Grid pattern — same recipe as globals.css .grid-pattern */
  .grid-pattern {
    position: absolute;
    inset: -10%;
    background-image:
      linear-gradient(to right, var(--card-accent, var(--accent)) 1px, transparent 1px),
      linear-gradient(to bottom, var(--card-accent, var(--accent)) 1px, transparent 1px);
    background-size: 56px 56px;
    opacity: 0.1;
    mask-image: radial-gradient(circle at var(--orb-x, 70%) var(--orb-y, 30%), black, transparent 75%);
    -webkit-mask-image: radial-gradient(circle at var(--orb-x, 70%) var(--orb-y, 30%), black, transparent 75%);
  }
  .grid-pattern::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(var(--card-accent, var(--accent)) 1.4px, transparent 1.4px);
    background-size: 56px 56px;
    opacity: 0.35;
  }

  .glow-orb {
    position: absolute;
    width: 46vw;
    height: 46vw;
    border-radius: 50%;
    background: var(--card-accent, var(--accent));
    filter: blur(90px);
    opacity: 0.22;
    top: var(--orb-top, -10%);
    left: var(--orb-left, 55%);
  }

  .noise {
    position: absolute;
    inset: 0;
    opacity: 0.035;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  /* Background logo — full NANO/SUDO lockup from the logo kit (kit/), large
     and partly bleeding off the right edge. primary variant: designed for
     the dark Terminal Black background, so colors stay inside the palette. */
  .kit-logo {
    position: absolute;
    width: 620px;
    height: 620px;
    right: -70px;
    top: 50%;
    transform: translateY(-50%);
    opacity: 0.9;
    filter: drop-shadow(0 0 80px rgba(74, 222, 128, 0.18));
  }

  .frame {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 64px 72px;
  }

  .brandrow {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brandrow img { width: 34px; height: 34px; display: block; }
  .brandrow span {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .year {
    margin-left: auto;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .content {
    display: flex;
    flex-direction: column;
    gap: 22px;
    max-width: 58%;
  }

  .eyebrow {
    display: inline-flex;
    align-self: flex-start;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--card-accent, var(--accent));
    border: 1px solid color-mix(in srgb, var(--card-accent, var(--accent)) 45%, transparent);
    background: color-mix(in srgb, var(--card-accent, var(--accent)) 12%, transparent);
    border-radius: 999px;
    padding: 8px 18px 8px 16px;
  }
  .eyebrow::before {
    content: '';
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--card-accent, var(--accent));
    flex-shrink: 0;
  }

  .wordmark {
    margin: 0;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: -0.02em;
    line-height: 0.98;
    color: var(--fg);
    font-stretch: 105%;
    text-wrap: balance;
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 6px;
  }
  .tag {
    font-size: 15px;
    font-weight: 600;
    color: var(--muted);
    border: 1px solid var(--border);
    background: color-mix(in srgb, var(--surface) 70%, transparent);
    border-radius: 999px;
    padding: 8px 18px;
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="grid-pattern" id="gridPattern"></div>
    <div class="glow-orb" id="glowOrb"></div>
    <img class="kit-logo" src="../public/brand/nanosudo-logo-primary.svg" alt="" />
    <div class="noise"></div>
    <div class="frame">
      <div class="brandrow">
        <img src="../public/brand/nanosudo-mark-primary.svg" alt="" />
        <span>nanosudo.com</span>
        <span class="year" id="year"></span>
      </div>
      <div class="content">
        <div class="eyebrow" id="category"></div>
        <h1 class="wordmark" id="wordmark"></h1>
        <div class="tags" id="tags"></div>
      </div>
    </div>
  </div>

<script>
  const PROJECTS = {
    invite:       { name: "Invite",                  category: "SaaS-платформа",       tags: ["Next.js","NestJS","tRPC","Prisma"],            year: 2026, accent: "spring",   orb: "tr" },
    rals:         { name: "RALS",                    category: "E-commerce и CRM",     tags: ["Next.js","NestJS","tRPC","Prisma"],            year: 2026, accent: "flamingo",  orb: "bl" },
    okiyo:        { name: "OKIYO",                    category: "E-commerce",           tags: ["Next.js","React 19","Payload CMS","PostgreSQL"], year: 2026, accent: "lime",    orb: "tl" },
    egemen:       { name: "Egemen\nQazaqstan",        category: "Медиа и миграция",     tags: ["Next.js","NestJS","TypeScript","PostgreSQL"],  year: 2026, accent: "azure",     orb: "br" },
    kazgazeta:    { name: "Qazaq\nGazetteri",         category: "Медиа и миграция",     tags: ["Next.js","NestJS","TypeScript","PostgreSQL"],  year: 2026, accent: "lime",      orb: "tr" },
    kazpravda:    { name: "Kazakhstanskaya\nPravda",  category: "Медиа и миграция",     tags: ["Next.js","NestJS","TypeScript","PostgreSQL"],  year: 2026, accent: "flamingo",  orb: "bl" },
    nativetravel: { name: "Visit\nAlmaty",           category: "Туристическая платформа", tags: ["Next.js","Fastify","tRPC","pgvector"],      year: 2026, accent: "spring",    orb: "tl" },
    "zakyat-kz":  { name: "ZAKYAT.KZ",                category: "Социальный проект",    tags: ["Next.js","TypeScript","PostgreSQL","Supabase"], year: 2024, accent: "azure",    orb: "br" },
  };

  const ACCENTS = {
    azure: "#99b9ff",
    spring: "#78ffd1",
    flamingo: "#ffb3c2",
    lime: "#f0ffa6",
  };

  const ORB_POS = {
    tr: { top: "-14%", left: "58%", maskX: "72%", maskY: "22%" },
    tl: { top: "-16%", left: "-10%", maskX: "18%", maskY: "20%" },
    br: { top: "48%", left: "62%", maskX: "74%", maskY: "78%" },
    bl: { top: "46%", left: "-14%", maskX: "16%", maskY: "76%" },
  };

  function wordmarkSize(name) {
    const longest = Math.max(...name.split("\n").map((l) => l.length));
    if (longest <= 6) return 128;
    if (longest <= 9) return 100;
    if (longest <= 14) return 76;
    return 60;
  }

  const params = new URLSearchParams(location.search);
  const id = params.get("id") || "invite";
  const p = PROJECTS[id];
  const accentHex = ACCENTS[p.accent];
  const orb = ORB_POS[p.orb];

  document.getElementById("stage").style.setProperty("--card-accent", accentHex);
  document.getElementById("glowOrb").style.top = orb.top;
  document.getElementById("glowOrb").style.left = orb.left;
  document.getElementById("gridPattern").style.setProperty("--orb-x", orb.maskX);
  document.getElementById("gridPattern").style.setProperty("--orb-y", orb.maskY);

  document.getElementById("year").textContent = p.year;
  document.getElementById("category").textContent = p.category;

  const wm = document.getElementById("wordmark");
  wm.style.fontSize = wordmarkSize(p.name) + "px";
  p.name.split("\n").forEach((line, i) => {
    if (i > 0) wm.appendChild(document.createElement("br"));
    wm.appendChild(document.createTextNode(line));
  });

  const tagsEl = document.getElementById("tags");
  p.tags.forEach((t) => {
    const el = document.createElement("span");
    el.className = "tag";
    el.textContent = t;
    tagsEl.appendChild(el);
  });
</script>
</body>
</html>
